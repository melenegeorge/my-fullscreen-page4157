<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fullscreen Image</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  </style>
</head>
<body>

  <img src="eikona.jpg" alt="Fullscreen Image" id="fullscreen-img">

  <script>
    document.addEventListener('click', function() {
      let elem = document.documentElement;
      if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari / Older Chrome */
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE/Edge */
          elem.msRequestFullscreen();
        }
      }
    });
  </script>

</body>
</html>

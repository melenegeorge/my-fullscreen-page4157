<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fullscreen Image Gallery</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body { 
      width: 100%; 
      height: 100%;
      min-height: 100.1vh; /* Βοηθά το Safari να συμπτύξει τις μπάρες navigation */
      background-color: #000000; 
      overflow: hidden; 
    }

    /* Container 1ης ιστοσελίδας */
    #page-1 {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    /* Σταθερό πάνω μέρος */
    #top-container {
      flex: 0 0 auto;
      width: 100%;
      z-index: 10;
      padding-top: env(safe-area-inset-top, 0px);
      background-color: #000000;
    }

    /* Κάτω μέρος με scroll */
    #bottom-container {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    img { 
      width: 100%; 
      height: auto; 
      display: block; 
      cursor: pointer; 
    }

    /* Container για τη 2η εικόνα - εξασφαλίζει ότι η εικόνα χωράει ολόκληρη στην οθόνη */
    #page-2 {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* 2η εικόνα: ρυθμισμένη με object-fit: contain ώστε να φαίνεται ολόκληρη χωρίς cropping */
    #img-2 {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100dvh;
      object-fit: contain; /* Προσαρμόζει το ζουμ αυτόματα ώστε να απεικονίζεται ολόκληρη */
    }

    /* Μικρό στρογγυλό κουμπί μόνο με το βέλος */
    .back-btn {
      display: none;
      position: fixed;
      top: calc(15px + env(safe-area-inset-top, 0px));
      left: calc(15px + env(safe-area-inset-left, 0px));
      z-index: 9999;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      font-size: 20px;
      line-height: 1;
      border: 1px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    .back-btn:active {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Στρογγυλό Κουμπί Πίσω (μόνο το βέλος) -->
  <button id="back-button" class="back-btn">&#8592;</button>

  <!-- Πρώτη Ιστοσελίδα (Χωρισμένη σε 2 τμήματα) -->
  <div id="page-1">
    <div id="top-container">
      <img src="eikona_a.jpg" alt="Fixed Top Image" class="clickable-img">
    </div>
    <div id="bottom-container">
      <img src="eikona_b.jpg" alt="Scrollable Bottom Image" class="clickable-img">
    </div>
  </div>

  <!-- Δεύτερη Ιστοσελίδα / Εικόνα -->
  <div id="page-2">
    <img src="eikona2.jpg" alt="Second Image" id="img-2">
  </div>

  <script>
    const page1 = document.getElementById('page-1');
    const page2 = document.getElementById('page-2');
    const img2 = document.getElementById('img-2');
    const backBtn = document.getElementById('back-button');
    const bottomContainer = document.getElementById('bottom-container');
    
    let currentImage = 1;

    // Προσπάθεια απόκρυψης των UI μπαρών του Safari
    function hideSafariAddressBar() {
      setTimeout(() => {
        window.scrollTo(0, 1);
      }, 50);
    }

    function switchImage() {
      if (currentImage === 1) {
        page1.style.display = "none";
        page2.style.display = "flex";
        backBtn.style.display = "flex";
        currentImage = 2;
      } else {
        page2.style.display = "none";
        page1.style.display = "flex";
        backBtn.style.display = "none";
        bottomContainer.scrollTop = 0;
        currentImage = 1;
      }
      hideSafariAddressBar();
    }

    // Έλεγχος υποστήριξης native Fullscreen API (Android)
    function supportsNativeFullscreen() {
      const docEl = document.documentElement;
      return !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen);
    }

    // Διαχείριση κλικ
    function handleImageClick() {
      let elem = document.documentElement;
      const isCurrentlyFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

      // Για Android
      if (supportsNativeFullscreen() && !isCurrentlyFullscreen) {
        let requestMethod = elem.requestFullscreen || elem.webkitRequestFullscreen;
        if (requestMethod) {
          let promise = requestMethod.call(elem);
          if (promise && promise.catch) {
            promise.catch(() => {
              switchImage();
            });
          }
        } else {
          switchImage();
        }
      } else {
        // Για iOS (Safari) ή όταν είναι ήδη Fullscreen
        switchImage();
      }
    }

    // Πάτημα στις εικόνες της 1ης σελίδας
    document.querySelectorAll('.clickable-img').forEach(img => {
      img.addEventListener('click', handleImageClick);
    });

    // Πάτημα στη 2η εικόνα
    img2.addEventListener('click', handleImageClick);

    // Πάτημα στο κουμπί Πίσω
    backBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      switchImage();
    });
  </script>

</body>
</html>

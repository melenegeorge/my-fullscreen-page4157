<html lang="el">
<head>
  <meta charset="UTF-8">
  <!-- Επιτρέπουμε το scrolling αλλά διατηρούμε σωστό το αρχικό zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Scrollable Image</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    html, body { 
      width: 100%; 
      background-color: #000000;
      /* Επιτρέπουμε το κατακόρυφο σκρολάρισμα */
      overflow-x: hidden;
      overflow-y: auto;
    }

    img { 
      /* Η εικόνα πιάνει όλο το πλάτος της οθόνης */
      width: 100%; 
      /* Το ύψος προσαρμόζεται αυτόματα για να μην παραμορφώνεται */
      height: auto; 
      display: block; 
      cursor: pointer; 
    }
  </style>
</head>
<body>

  <img src="eikona.jpg" alt="Fullscreen Image" id="fullscreen-img">

  <script>
    /* Ενεργοποίηση Native Fullscreen με το πρώτο άγγιγμα στην οθόνη */
    document.addEventListener('click', function() {
      let elem = document.documentElement;
      if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }
      }
    });
  </script>

</body>
</html>

<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fullscreen Image Gallery</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body { 
      width: 100%; 
      height: 100%;
      min-height: 100.1vh;
      background-color: #000000; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Οθόνη Εισαγωγής Κωδικού */
    #login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000000;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 30px 25px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .login-box h2 {
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 500;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      font-size: 20px;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      margin-bottom: 15px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: #ffffff;
      color: #000000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .login-box button:active {
      background-color: #cccccc;
    }

    #error-msg {
      color: #ff4d4d;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    /* Container 1ης ιστοσελίδας */
    #page-1 {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    /* Σταθερό πάνω μέρος */
    #top-container {
      flex: 0 0 auto;
      width: 100%;
      z-index: 10;
      padding-top: env(safe-area-inset-top, 0px);
      background-color: #000000;
    }

    /* Κάτω μέρος με scroll */
    #bottom-container {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    img { 
      width: 100%; 
      height: auto; 
      display: block; 
      cursor: pointer; 
    }

    /* Container για τη 2η εικόνα */
    #page-2 {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* 2η εικόνα */
    #img-2 {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100dvh;
      object-fit: contain;
    }

    /* Μικρό στρογγυλό κουμπί μόνο με το βέλος */
    .back-btn {
      display: none;
      position: fixed;
      top: calc(15px + env(safe-area-inset-top, 0px));
      left: calc(15px + env(safe-area-inset-left, 0px));
      z-index: 9999;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      font-size: 20px;
      line-height: 1;
      border: 1px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    .back-btn:active {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Οθόνη Εισαγωγής Κωδικού -->
  <div id="login-overlay">
    <div class="login-box">
      <h2>Εισάγετε Κωδικό</h2>
      <input type="password" id="password-input" placeholder="****" maxlength="10" pattern="[0-9]*" inputmode="numeric">
      <button id="login-btn">Είσοδος</button>
      <p id="error-msg">Λάθος κωδικός!</p>
    </div>
  </div>

  <!-- Στρογγυλό Κουμπί Πίσω (μόνο το βέλος) -->
  <button id="back-button" class="back-btn">&#8592;</button>

  <!-- Πρώτη Ιστοσελίδα (Χωρισμένη σε 2 τμήματα) -->
  <div id="page-1">
    <div id="top-container">
      <img src="eikona_a.jpg" alt="Fixed Top Image" class="clickable-img">
    </div>
    <div id="bottom-container">
      <img src="eikona_b.jpg" alt="Scrollable Bottom Image" class="clickable-img">
    </div>
  </div>

  <!-- Δεύτερη Ιστοσελίδα / Εικόνα -->
  <div id="page-2">
    <img src="eikona2.jpg" alt="Second Image" id="img-2">
  </div>

  <script>
    // Διαχείριση Κωδικού Πρόσβασης
    const CORRECT_PIN = "4157";
    const loginOverlay = document.getElementById('login-overlay');
    const passwordInput = document.getElementById('password-input');
    const loginBtn = document.getElementById('login-btn');
    const errorMsg = document.getElementById('error-msg');

    function checkPassword() {
      if (passwordInput.value === CORRECT_PIN) {
        sessionStorage.setItem("authenticated", "true");
        loginOverlay.style.display = "none";
      } else {
        errorMsg.style.display = "block";
        passwordInput.value = "";
      }
    }

    // Έλεγχος αν ο χρήστης έχει ήδη συνδεθεί στη συγκεκριμένη συνεδρία
    if (sessionStorage.getItem("authenticated") === "true") {
      loginOverlay.style.display = "none";
    }

    loginBtn.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });

    // Λοιπές Λειτουργίες
    const page1 = document.getElementById('page-1');
    const page2 = document.getElementById('page-2');
    const img2 = document.getElementById('img-2');
    const backBtn = document.getElementById('back-button');
    const bottomContainer = document.getElementById('bottom-container');
    
    let currentImage = 1;

    function hideSafariAddressBar() {
      setTimeout(() => {
        window.scrollTo(0, 1);
      }, 50);
    }

    function switchImage() {
      if (currentImage === 1) {
        page1.style.display = "none";
        page2.style.display = "flex";
        backBtn.style.display = "flex";
        currentImage = 2;
      } else {
        page2.style.display = "none";
        page1.style.display = "flex";
        backBtn.style.display = "none";
        bottomContainer.scrollTop = 0;
        currentImage = 1;
      }
      hideSafariAddressBar();
    }

    function supportsNativeFullscreen() {
      const docEl = document.documentElement;
      return !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen);
    }

    function handleImageClick() {
      let elem = document.documentElement;
      const isCurrentlyFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

      if (supportsNativeFullscreen() && !isCurrentlyFullscreen) {
        let requestMethod = elem.requestFullscreen || elem.webkitRequestFullscreen;
        if (requestMethod) {
          let promise = requestMethod.call(elem);
          if (promise && promise.catch) {
            promise.catch(() => {
              switchImage();
            });
          }
        } else {
          switchImage();
        }
      } else {
        switchImage();
      }
    }

    document.querySelectorAll('.clickable-img').forEach(img => {
      img.addEventListener('click', handleImageClick);
    });

    img2.addEventListener('click', handleImageClick);

    backBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      switchImage();
    });
  </script>

</body>
</html>

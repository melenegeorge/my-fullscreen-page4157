<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Scrollable Image</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; background-color: #000000; overflow-x: hidden; overflow-y: auto; }
    img { width: 100%; height: auto; display: block; cursor: pointer; }
    a { display: block; text-decoration: none; }
  </style>
</head>
<body>

  <!-- Σύνδεσμος που οδηγεί στο page2.html -->
  <a href="page2.html" id="image-link">
    <img src="eikona.jpg" alt="First Fullscreen Image">
  </a>

  <script>
    const link = document.getElementById('image-link');

    link.addEventListener('click', function(e) {
      // Εμποδίζουμε τη στιγμιαία μετάβαση για να προλάβει να ενεργοποιηθεί το Fullscreen
      e.preventDefault();
      
      let elem = document.documentElement;

      // Ενεργοποίηση Fullscreen
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      }

      // Μετάβαση στη νέα σελίδα μετά από ελάχιστο χρόνο (100ms)
      setTimeout(function() {
        window.location.href = "page2.html";
      }, 100);
    });
  </script>

</body>
</html>

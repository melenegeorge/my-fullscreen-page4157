<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Image Gallery</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    html, body { 
      width: 100%; 
      background-color: #000000; 
      overflow-x: hidden; 
      overflow-y: auto; 
    }

    img { 
      width: 100%; 
      height: auto; 
      display: block; 
      cursor: pointer; 
    }

    /* Κουμπί επιστροφής (κρυμμένο αρχικά) */
    .back-btn {
      display: none; /* Εμφανίζεται μόνο στη 2η εικόνα */
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      background-color: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 25px;
      font-family: sans-serif;
      font-size: 16px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(5px);
      cursor: pointer;
    }

    .back-btn:active {
      background-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- Κουμπί Πίσω -->
  <button id="back-button" class="back-btn">&#8592; Πίσω</button>

  <!-- Η Εικόνα -->
  <img src="eikona.jpg" alt="Fullscreen Image" id="main-image">

  <script>
    const imgElement = document.getElementById('main-image');
    const backBtn = document.getElementById('back-button');
    
    // Μεταβλητή για να ξέρουμε ποια εικόνα βλέπουμε (1 ή 2)
    let currentImage = 1;

    // Πάτημα στην εικόνα
    imgElement.addEventListener('click', function() {
      // 1. Ενεργοποίηση Fullscreen
      let elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      }

      // 2. Αν είμαστε στην 1η εικόνα, αλλάζουμε στη 2η
      if (currentImage === 1) {
        imgElement.src = "eikona2.jpg";
        backBtn.style.display = "block"; // Εμφάνιση κουμπιού Πίσω
        currentImage = 2;
        window.scrollTo(0, 0); // Σκρολάρισμα στην κορυφή
      }
    });

    // Πάτημα στο κουμπί Πίσω
    backBtn.addEventListener('click', function(e) {
      e.stopPropagation(); // Εμποδίζει το πάτημα να πιάσει και στην εικόνα
      
      imgElement.src = "eikona.jpg";
      backBtn.style.display = "none"; // Απόκρυψη κουμπιού
      currentImage = 1;
      window.scrollTo(0, 0);
    });
  </script>

</body>
</html>

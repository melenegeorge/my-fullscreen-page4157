<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Image Gallery</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    html, body { 
      width: 100%; 
      background-color: #000000; 
      overflow-x: hidden; 
      overflow-y: auto; 
    }

    img { 
      width: 100%; 
      height: auto; 
      display: block; 
      cursor: pointer; 
    }

    /* Μικρό στρογγυλό κουμπί μόνο με το βέλος */
    .back-btn {
      display: none; /* Εμφανίζεται μόνο στη 2η εικόνα */
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 9999;
      width: 42px;
      height: 42px;
      border-radius: 50%; /* Πλήρως στρογγυλό */
      background-color: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      font-size: 20px;
      line-height: 1;
      border: 1px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(5px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    .back-btn:active {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Στρογγυλό Κουμπί Πίσω (μόνο το βέλος) -->
  <button id="back-button" class="back-btn">&#8592;</button>

  <!-- Η Εικόνα -->
  <img src="eikona.jpg" alt="Fullscreen Image" id="main-image">

  <script>
    const imgElement = document.getElementById('main-image');
    const backBtn = document.getElementById('back-button');
    
    let currentImage = 1;

    function switchImage() {
      if (currentImage === 1) {
        imgElement.src = "eikona2.jpg";
        backBtn.style.display = "flex"; // Εμφάνιση του στρογγυλού κουμπιού
        currentImage = 2;
      } else {
        imgElement.src = "eikona.jpg";
        backBtn.style.display = "none";
        currentImage = 1;
      }
      window.scrollTo(0, 0);
    }

    // Πάτημα στην εικόνα
    imgElement.addEventListener('click', function() {
      let elem = document.documentElement;

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        switchImage();
      }
    });

    // Πάτημα στο κουμπί Πίσω
    backBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      switchImage();
    });
  </script>

</body>
</html>

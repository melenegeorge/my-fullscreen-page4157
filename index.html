<html lang="el">
<head>
  <meta charset="UTF-8">
  <!-- Προσθήκη viewport-fit=cover για σωστή εφαρμογή σε iPhone με Notch/Dynamic Island -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fullscreen Image Gallery</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; /* Αφαίρεση μπλε highlight στο άγγιγμα σε iOS */
    }

    html, body { 
      width: 100%; 
      height: 100%;
      background-color: #000000; 
      overflow: hidden; 
    }

    /* Container 1ης ιστοσελίδας */
    #page-1 {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height για πλήρη κάλυψη σε iOS Safari */
    }

    /* Σταθερό πάνω μέρος */
    #top-container {
      flex: 0 0 auto;
      width: 100%;
      z-index: 10;
      padding-top: env(safe-area-inset-top, 0px); /* Προστασία από το Notch στο iOS */
      background-color: #000000;
    }

    /* Κάτω μέρος με scroll */
    #bottom-container {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* Ομαλό (smooth) scrolling στο iOS */
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    img { 
      width: 100%; 
      height: auto; 
      display: block; 
      cursor: pointer; 
    }

    /* 2η εικόνα */
    #img-2 {
      display: none;
      width: 100%;
      height: auto;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Μικρό στρογγυλό κουμπί μόνο με το βέλος */
    .back-btn {
      display: none; /* Εμφανίζεται μόνο στη 2η εικόνα */
      position: fixed;
      top: calc(15px + env(safe-area-inset-top, 0px));
      left: calc(15px + env(safe-area-inset-left, 0px));
      z-index: 9999;
      width: 42px;
      height: 42px;
      border-radius: 50%; /* Πλήρως στρογγυλό */
      background-color: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      font-size: 20px;
      line-height: 1;
      border: 1px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    .back-btn:active {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Στρογγυλό Κουμπί Πίσω (μόνο το βέλος) -->
  <button id="back-button" class="back-btn">&#8592;</button>

  <!-- Πρώτη Ιστοσελίδα (Χωρισμένη σε 2 τμήματα) -->
  <div id="page-1">
    <div id="top-container">
      <img src="eikona_a.jpg" alt="Fixed Top Image" class="clickable-img">
    </div>
    <div id="bottom-container">
      <img src="eikona_b.jpg" alt="Scrollable Bottom Image" class="clickable-img">
    </div>
  </div>

  <!-- Δεύτερη Ιστοσελίδα / Εικόνα -->
  <img src="eikona2.jpg" alt="Second Image" id="img-2">

  <script>
    const page1 = document.getElementById('page-1');
    const img2 = document.getElementById('img-2');
    const backBtn = document.getElementById('back-button');
    const bottomContainer = document.getElementById('bottom-container');
    
    let currentImage = 1;

    function switchImage() {
      if (currentImage === 1) {
        page1.style.display = "none";
        img2.style.display = "block";
        backBtn.style.display = "flex"; // Εμφάνιση του στρογγυλού κουμπιού
        currentImage = 2;
      } else {
        img2.style.display = "none";
        page1.style.display = "flex";
        backBtn.style.display = "none";
        bottomContainer.scrollTop = 0; // Επαναφορά scroll στην αρχή
        currentImage = 1;
      }
      window.scrollTo(0, 0);
    }

    // Διαχείριση κλικ για είσοδο σε Fullscreen ή εναλλαγή εικόνας (συμβατό με iOS & Android)
    function handleImageClick() {
      let elem = document.documentElement;

      const isFullscreenSupported = elem.requestFullscreen || elem.webkitRequestFullscreen;
      const isCurrentlyFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

      if (isFullscreenSupported && !isCurrentlyFullscreen) {
        let req = elem.requestFullscreen ? elem.requestFullscreen() : elem.webkitRequestFullscreen();
        
        // Σε περίπτωση που το iOS/Browser αρνηθεί το Fullscreen API, εκτελούμε την αλλαγή κανονικά
        if (req && req.catch) {
          req.catch(() => {
            switchImage();
          });
        }
      } else {
        switchImage();
      }
    }

    // Πάτημα στις εικόνες της 1ης σελίδας
    document.querySelectorAll('.clickable-img').forEach(img => {
      img.addEventListener('click', handleImageClick);
    });

    // Πάτημα στη 2η εικόνα
    img2.addEventListener('click', handleImageClick);

    // Πάτημα στο κουμπί Πίσω
    backBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      switchImage();
    });
  </script>

</body>
</html>
